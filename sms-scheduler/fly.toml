# Fly.io config. Rename `app` to something unique (or let `fly launch` set it).
# Sydney region is closest to Melbourne. The key settings are auto_stop_machines
# = false + min_machines_running = 1, which keep the machine ALWAYS ON so the
# in-process APScheduler keeps ticking (a sleeping host would pause the timer).

app = "clupai-sms-scheduler"
primary_region = "syd"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
